# Qodo (PR-Agent) Open Source Configuration for nID
# Reference: https://docs.qodo.ai/configuration

[config]
model = "gpt-4o"
fallback_models = ["gpt-4o-mini"]
git_provider = "github"
publish_output = true
auto_review = true
ignore_pr_title = ["^\\[wip\\]", "^draft:"]
ignore_pr_labels = ["skip-review", "automated-pr"]
ignore_bot_pr = true

[github_app]
pr_commands = [
    "/agentic_describe",
    "/agentic_review"
]
handle_push_trigger = true
push_commands = [
    "/agentic_review"
]
feedback_on_draft_pr = false

[review_agent]
comments_location_policy = "both"
inline_comments_severity_threshold = 2
comments_routing_preset = "both"

enable_incremental_review = true
persistent_comment_notification = true
publish_in_progress_comment = true

enable_commitable_suggestions = true
enable_review_md = true
override_effort = "standard"

issues_user_guidelines = """
1. Banking-Grade Identity & Vault Security: Ensure OAuth2 Relying Party secrets and encrypted vault storage never leak in logs, queries, or errors.
2. Anti-Spoofing & Liveness: Ensure biometric and liveness engine checks strictly reject static/manipulated images and verify live interaction.
3. Multi-Tenant Scoping: Verify that all identity records, client registrations, and vault secrets are scoped by tenant_id.
4. Cryptographic Integrity: Adhere to RSA-4096 / AES-256-GCM / HMAC-SHA-512 dual-key isolation standards.
"""

compliance_user_guidelines = """
1. Zero tolerance for PHP: Ensure 0.0% PHP in the codebase.
2. Prisma Migration Safety: Ensure all database changes have backwards-compatible forward-only migrations.
3. Clean Error Handling: Avoid exposing internal cryptographic salt, keys, or stack traces.
"""

[review_agent_ux]
finding_overflow_count = 3
use_images_and_animations = true
show_context_used = true
show_persistent_review_section = true
show_daily_tips = false
show_dividers = true
show_comment_footer = true
severity_terminology = "high_medium_low"
findings_label_coloring = "simplified"
show_resolved_findings = true
resolved_findings_placement = "in_place"

expand_description = true
expand_code = true
expand_recommendation = true
expand_evidence = false

[qodo_describe_agent]
publish_mode = "dynamic"
publish_review_time_estimate_labels = true

[pr_code_suggestions]
num_code_suggestions = 4
rank_suggestions = true
enable_chat_in_code_suggestions = true

[chat_agent]
enabled = true
enable_fixer_agent = true

[fixer_agent]
enable = true
enable_auto_fix = false
action_level_threshold = 2
open_new_pr = false

[checks]
enable_auto_checks_feedback = true
persistent_comment = true
