syntax = "proto3";

package newax.access.v1;

service AccessApiService {
  rpc CreateGrant(CreateGrantRequest) returns (AccessGrantResponse);
  rpc ListGrants(ListGrantsRequest) returns (AccessGrantListResponse);
  rpc GetGrant(GetGrantRequest) returns (AccessGrantResponse);
  rpc UpdateGrant(UpdateGrantRequest) returns (AccessGrantResponse);
  rpc RevokeGrant(RevokeGrantRequest) returns (Empty);
  rpc TransferOwnership(TransferOwnershipRequest) returns (AccessGrantResponse);
  rpc AddPartner(AddPartnerRequest) returns (AccessGrantResponse);
  rpc GetMyPermissions(GetMyPermissionsRequest) returns (MyPermissionsResponse);
}

message Empty {}

message CreateGrantRequest {
  string caller_id = 1;
  string tenant_id = 2;
  string account_id = 3;
  optional string organization_id = 4;
  optional string brand_id = 5;
  string access_type = 6;
  optional double partnership_percentage = 7;
}

message ListGrantsRequest {
  string caller_id = 1;
  string tenant_id = 2;
  optional string organization_id = 3;
  optional string brand_id = 4;
}

message GetGrantRequest {
  string caller_id = 1;
  string tenant_id = 2;
  string grant_id = 3;
}

message UpdateGrantRequest {
  string caller_id = 1;
  string tenant_id = 2;
  string grant_id = 3;
  optional string access_type = 4;
  optional double partnership_percentage = 5;
  optional string status = 6;
}

message RevokeGrantRequest {
  string caller_id = 1;
  string tenant_id = 2;
  string grant_id = 3;
}

message TransferOwnershipRequest {
  string caller_id = 1;
  string tenant_id = 2;
  string new_owner_id = 3;
  optional string organization_id = 4;
  optional string brand_id = 5;
}

message AddPartnerRequest {
  string caller_id = 1;
  string tenant_id = 2;
  string account_id = 3;
  double percentage = 4;
}

message GetMyPermissionsRequest {
  string account_id = 1;
  string tenant_id = 2;
  optional string organization_id = 3;
  optional string brand_id = 4;
}

message AccessGrantResponse {
  string id = 1;
  string account_id = 2;
  string tenant_id = 3;
  optional string organization_id = 4;
  optional string brand_id = 5;
  string access_type = 6;
  optional double partnership_percentage = 7;
  string granted_by = 8;
  string status = 9;
  string granted_at = 10;
  optional string account_phone = 11;
  optional string account_email = 12;
}

message AccessGrantListResponse {
  repeated AccessGrantResponse grants = 1;
}

message PermissionEntry {
  string group_name = 1;
  string service_name = 2;
  string permission_key = 3;
  string label = 4;
  bool granted = 5;
}

message MyPermissionsResponse {
  string account_id = 1;
  string tenant_id = 2;
  repeated PermissionEntry permissions = 3;
}
