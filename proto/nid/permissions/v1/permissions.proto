syntax = "proto3";

package newax.permissions.v1;

service PermissionsService {
  rpc GetCatalog(Empty) returns (PermissionGroupList);
  rpc GetAll(Empty) returns (PermissionEntryList);
  rpc GetGroup(GroupRequest) returns (PermissionEntryList);
}

message Empty {}

message GroupRequest {
  string group_name = 1;
}

message PermissionCatalogEntry {
  string id = 1;
  string group_name = 2;
  string service_name = 3;
  string permission_key = 4;
  string label = 5;
  optional string description = 6;
}

message PermissionGroup {
  string group_name = 1;
  repeated PermissionCatalogEntry permissions = 2;
}

message PermissionGroupList {
  repeated PermissionGroup groups = 1;
}

message PermissionEntryList {
  repeated PermissionCatalogEntry entries = 1;
}
