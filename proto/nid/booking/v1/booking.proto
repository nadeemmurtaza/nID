syntax = "proto3";

package newax.booking.v1;

service BookingApiService {
  rpc CreateService(CreateServiceRequest) returns (ServiceResponse);
  rpc ListMyServices(AccountIdRequest) returns (ServiceListResponse);
  rpc UpdateService(UpdateServiceRequest) returns (ServiceResponse);
  rpc RemoveService(RemoveServiceRequest) returns (Empty);
  rpc CreateAvailabilityRule(CreateAvailabilityRuleRequest) returns (AvailabilityRuleResponse);
  rpc ListMyAvailabilityRules(AccountIdRequest) returns (AvailabilityRuleListResponse);
  rpc RemoveAvailabilityRule(RemoveAvailabilityRuleRequest) returns (Empty);
  rpc UpdateAvailabilityRule(UpdateAvailabilityRuleRequest) returns (AvailabilityRuleResponse);
  rpc ComputeFreeSlots(ComputeFreeSlotsRequest) returns (FreeSlotListResponse);
  rpc ListMyAppointments(AccountIdRequest) returns (AppointmentListResponse);
  rpc ConfirmAppointment(ConfirmAppointmentRequest) returns (AppointmentResponse);
  rpc CancelAppointment(CancelAppointmentRequest) returns (AppointmentResponse);
  rpc ListPublicServices(SlugRequest) returns (ServiceListResponse);
  rpc CreatePublicAppointment(CreatePublicAppointmentRequest) returns (AppointmentResponse);
}

message Empty {}

message AccountIdRequest {
  string account_id = 1;
}

message SlugRequest {
  string slug = 1;
}

message CreateServiceRequest {
  string account_id = 1;
  string name = 2;
  int32 duration_minutes = 3;
  optional double price = 4;
  optional string currency = 5;
  optional string description = 6;
  optional bool is_active = 7;
}

message UpdateServiceRequest {
  string account_id = 1;
  string service_id = 2;
  optional string name = 3;
  optional int32 duration_minutes = 4;
  optional double price = 5;
  optional bool is_active = 6;
  optional string description = 7;
  optional string currency = 8;
}

message RemoveServiceRequest {
  string account_id = 1;
  string service_id = 2;
}

message CreateAvailabilityRuleRequest {
  string account_id = 1;
  string day = 2;
  int32 start_minute = 3;
  int32 end_minute = 4;
  optional bool is_active = 5;
}

message RemoveAvailabilityRuleRequest {
  string account_id = 1;
  string rule_id = 2;
}

message UpdateAvailabilityRuleRequest {
  string account_id = 1;
  string rule_id = 2;
  optional string day = 3;
  optional int32 start_minute = 4;
  optional int32 end_minute = 5;
  optional bool is_active = 6;
}

message ComputeFreeSlotsRequest {
  string slug = 1;
  string service_id = 2;
  string from = 3;
  string to = 4;
}

message ConfirmAppointmentRequest {
  string account_id = 1;
  string appointment_id = 2;
}

message CancelAppointmentRequest {
  string account_id = 1;
  string appointment_id = 2;
}

message CreatePublicAppointmentRequest {
  string slug = 1;
  string service_id = 2;
  string starts_at = 3;
  string visitor_name = 4;
  optional string visitor_phone = 5;
  optional string visitor_email = 6;
  optional string notes = 7;
}

message ServiceResponse {
  string id = 1;
  string profile_id = 2;
  string name = 3;
  int32 duration_minutes = 4;
  optional double price = 5;
  optional string currency = 6;
  optional string description = 7;
  bool is_active = 8;
}

message ServiceListResponse {
  repeated ServiceResponse services = 1;
}

message AvailabilityRuleResponse {
  string id = 1;
  string profile_id = 2;
  string day = 3;
  int32 start_minute = 4;
  int32 end_minute = 5;
  bool is_active = 6;
}

message AvailabilityRuleListResponse {
  repeated AvailabilityRuleResponse rules = 1;
}

message FreeSlotResponse {
  string starts_at = 1;
  string ends_at = 2;
}

message FreeSlotListResponse {
  repeated FreeSlotResponse slots = 1;
}

message AppointmentResponse {
  string id = 1;
  string profile_id = 2;
  string service_id = 3;
  string starts_at = 4;
  string ends_at = 5;
  string status = 6;
  string visitor_name = 7;
  optional string visitor_phone = 8;
  optional string visitor_email = 9;
  optional string notes = 10;
  optional string service_name = 11;
}

message AppointmentListResponse {
  repeated AppointmentResponse appointments = 1;
}
